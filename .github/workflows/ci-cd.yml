name: "CI/CD"

on:
  pull_request:
    branches:
      - master
      - net9
  push:
    branches:
      - master
      - net9
    tags:
      - v*

env:
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # NuGet trusted publishing (GitHub OIDC token)

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Extract version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      shell: bash
      run: |
        tag="${{ github.ref_name }}"
        version="${tag#v}"
        declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' common.props | head -n 1)
        if [ "$declared" != "$version" ]; then
          echo "::error::Tag '$tag' must match common.props <Version> '$declared'"
          exit 1
        fi
        if [ "$(git rev-parse "refs/tags/${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
          echo "::error::Tag '$tag' must point to the commit being built"
          exit 1
        fi
        echo "VERSION=$version" >> $GITHUB_OUTPUT
        echo "TAG=$tag" >> $GITHUB_OUTPUT
        echo "Release version: $version"

    - name: Check README package list
      if: ${{ github.base_ref != 'net9' && github.ref_name != 'net9' && !startsWith(github.ref_name, 'v4.') }}
      shell: pwsh
      run: ./scripts/update-readme-packages.ps1 -Check

    - name: Build All Solutions
      shell: bash
      run: |
        while IFS= read -r solution; do
          [ -z "$solution" ] && continue
          echo "::group::Building solution: $solution"
          if ! dotnet build "$solution" -c Release; then
            echo "::error::Build failed for solution: $solution"
            exit 1
          fi
          echo "::endgroup::"
        done < solutions.txt
        echo "✓ All solutions built successfully!"

    - name: Test coverage reporting
      shell: pwsh
      run: |
        python -m unittest discover -s scripts -p test_coverage_report.py -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./scripts/Test-Coverage.ps1 -NoBuild

    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-coverage
        if-no-files-found: ignore
        path: |
          artifacts/coverage/**/summary.json
          artifacts/coverage/**/summary.md
          artifacts/coverage/**/tests.trx
          artifacts/coverage/**/coverage.cobertura.xml

    # 以下步骤仅在 tag 推送时执行
    - name: Pack All Solutions
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        # 创建输出目录
        mkdir -p dest

        while IFS= read -r solution; do
          [ -z "$solution" ] && continue
          echo "::group::Packing solution: $solution"
          if ! dotnet pack "$solution" -c Release --include-symbols --no-build -o dest; then
            echo "::error::Pack failed for solution: $solution"
            exit 1
          fi
          echo "::endgroup::"
        done < solutions.txt
        echo "✓ All solutions packed successfully!"

    # Trusted publishing: exchange this run's GitHub OIDC token for a one-hour
    # nuget.org API key. Requires a nuget.org trusted publishing policy for
    # cocosip/sharp-abp + ci-cd.yml; no long-lived NUGET_API_KEY secret is used.
    - name: NuGet login (OIDC -> temporary API key)
      if: startsWith(github.ref, 'refs/tags/v')
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: virtual # nuget.org profile name (not email); public, so no secret is needed

    - name: Publish to NuGet
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        echo "Publishing NuGet packages..."

        # 检查 dest 目录是否存在
        if [ ! -d "dest" ]; then
          echo "::error::dest directory does not exist"
          exit 1
        fi

        # 获取所有 .nupkg 文件（排除 symbols 包）
        shopt -s nullglob
        packages=(dest/*.nupkg)
        filtered_packages=()

        for pkg in "${packages[@]}"; do
          if [[ ! "$pkg" == *.symbols.nupkg ]]; then
            filtered_packages+=("$pkg")
          fi
        done

        if [ ${#filtered_packages[@]} -eq 0 ]; then
          echo "::error::No NuGet packages found in dest directory"
          exit 1
        fi

        echo "Found ${#filtered_packages[@]} packages to publish"

        # 发布每个包
        for package in "${filtered_packages[@]}"; do
          echo "::group::Publishing: $(basename "$package")"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if [ $? -ne 0 ]; then
            echo "::error::Failed to publish: $(basename "$package")"
            exit 1
          fi
          echo "::endgroup::"
        done

        echo "✓ All NuGet packages published successfully!"

    - name: Generate release notes
      if: startsWith(github.ref, 'refs/tags/v')
      id: release_notes
      shell: bash
      run: |
        current_tag="${{ steps.version.outputs.TAG }}"

        # 获取上一个 tag
        previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")

        if [ -n "$previous_tag" ]; then
          echo "Generating changelog from $previous_tag to $current_tag"

          # 获取两个 tag 之间的提交历史
          changelog=$(git log "$previous_tag..$current_tag" --pretty=format:"- %h - %s (%an)" --no-merges)

          # 统计信息
          commit_count=$(git log "$previous_tag..$current_tag" --oneline --no-merges | wc -l)
          changed_files=$(git diff --name-only "$previous_tag..$current_tag" | wc -l)

          stats_line="**$commit_count commits** | **$changed_files files changed** | Changes from [\`$previous_tag\`](https://github.com/${{ github.repository }}/releases/tag/$previous_tag) to [\`$current_tag\`](https://github.com/${{ github.repository }}/releases/tag/$current_tag)"
          full_changelog_line="- [Full Changelog](https://github.com/${{ github.repository }}/compare/$previous_tag...$current_tag)"
        else
          echo "No previous tag found, this is the first release"
          changelog="This is the first release."
          stats_line=""
          full_changelog_line=""
        fi

        # 生成 Release Notes
        delimiter="EOF_DELIMITER_$RANDOM"
        {
          echo "NOTES<<$delimiter"
          echo "## SharpAbp ${{ steps.version.outputs.VERSION }}"
          echo ""
          echo "### 📦 NuGet Packages"
          echo "This release has been published to NuGet.org. You can install the packages using:"
          echo '```bash'
          echo "dotnet add package <PackageName> --version ${{ steps.version.outputs.VERSION }}"
          echo '```'
          echo ""
          echo "### 📝 What's Changed"
          [ -n "$stats_line" ] && echo "$stats_line"
          echo ""
          echo "$changelog"
          echo ""
          echo "### 🔗 Useful Links"
          echo "- [NuGet Gallery](https://www.nuget.org/profiles/virtual)"
          echo "- [Documentation](https://github.com/${{ github.repository }})"
          [ -n "$full_changelog_line" ] && echo "$full_changelog_line"
          echo ""
          echo "---"
          echo "🤖 This release was automatically created by GitHub Actions"
          echo "$delimiter"
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.version.outputs.VERSION }}
        body: ${{ steps.release_notes.outputs.NOTES }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
